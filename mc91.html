        purple, 
        blue, 
        darkblue, 
        lightblue, 
        white, 
        yellow, 
        green,
        transparent
      );
    background-size: 400% 100%; /* 增加背景大小，以创建动画效果 */
    animation: Gradient 5s ease infinite; /* 添加动画 */
  }
  
  @keyframes Gradient {
    0% {
      background-position: 0% 50%;
    }
    100% {
      background-position: 400% 50%;
    }

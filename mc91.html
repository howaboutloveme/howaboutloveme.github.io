<!DOCTYPE html>
<html>
        <head>
<link rel="stylesheet" href="1/91.css">
<meta name="viewport"content="width=device-width,initial-scale=1.0"> 
<title>mc91 skyblock</title>
<style>
  body {
    background-color: black; /* 设置背景颜色为黑色 */
    color: white;            /* 设置文本颜色为白色，以提高可读性 */
  }

        .blurry {
                                text-align: center;
            position: relative;
            background-color: rgba(128, 128, 128, 0.5); /* 背景颜色，可以是半透明 */
            padding: 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px); /* 添加模糊效果，值越大模糊度越高 */
            -webkit-backdrop-filter: blur(10px); /* Safari 和 Chrome 需要前缀 */
        }


.jbt {

    height: 5px; /* 设置渐变条的高度 */
    width: 100vw; /* 设置渐变条的宽度为视口宽度 */
    position: relative; /* 使元素可以相对于其正常位置定位 */
    left: 50%; /* 向左移动50% */
    transform: translateX(-50%); /* 再次向左移动50%自身宽度，实现居中效果 */
    background: 
      linear-gradient(90deg, 
        purple, 
        blue, 
        darkblue, 
        lightblue, 
        white, 
        yellow, 
        green,
        transparent
      );


                </style>        
        </head>
        <body>


        <div class="jbt"></div>


<div class="container">
        <div class="text left" id="leftText">我的</div>
        <div class="text right" id="rightText">世界</div>
        <div class="skyblock">skyblock</div>
    </div>




<script src="1/91.js"></script>
        </body>

</html>

<!DOCTYPE html>
<html>
        <head>
<meta name="viewport"content="width=device-width,initial-scale=1.0"> 
                <meta charset="utf-8" />
                <title></title>
                <style>
.jbt {
    height: 5px; /* 设置渐变条的高度 */
    width: 400%; /* 设置渐变条的宽度为*/
    background: 
      linear-gradient(90deg, 
        purple, 
        blue, 
        darkblue, 
        lightblue, 
        white, 
        yellow, 
        green,
        transparent
      );
    background-size: 400% 100%; /* 增加背景大小，以创建动画效果 */
    animation: Gradient 30s ease infinite; /* 添加动画 */
  }

  @keyframes Gradient {
    0% {
      background-position: 0% 50%;
    }
    100% {
      background-position: 400% 50%;
    }

                        .kuangjia
                        {
                                text-align: center;
                                width: 300px;
                                margin: 7% auto;
                        border-radius: 25px;
                        border-color: ghostwhite;
                        background-color: rgba(0,0,0.0,0.1);
                        box-shadow: 0 0 15px #333;
                        }
                        body
                        {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: black;
                        }
                        .wb
                        {
                                background-color: rgba(0,0,0,0.1);
                                width: 200px;
                                margin: 5% auto;
                                box-shadow: 0 0 15px blue;
                        }
                        .button
                        {
                                background-color: rgba(0,0,0,0.1);
                                width: 50px;
                                margin: 5% auto;
                                color: whitesmoke;
                                background-color: #333333;
                                box-shadow: 0 0 15px #333;
                        }
                        .button:hover
                        {
                                background-color: rgba(0,0,0,0.1);
                                width: 50px;
                                margin: 5% auto;
                                color: black;
                                background-color: whitesmoke;
                                box-shadow: 0 0 15px #333;
                        }
                </style>
        </head>
        <body class="kuangjia">


        <div class="jbt"></div>
                <h1>登录</h1>


        </body>

</html>

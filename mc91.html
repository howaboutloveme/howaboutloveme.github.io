<!DOCTYPE html>
<html>
        <head>
<title>mc91 skyblock</title>
<style>
  body {
    background-color: black; /* 设置背景颜色为黑色 */
    color: white;            /* 设置文本颜色为白色，以提高可读性 */
  }

        .blurry {
            position: relative;
            background-color: rgba(255, 255, 255, 0.5); /* 背景颜色，可以是半透明 */
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px); /* 添加模糊效果，值越大模糊度越高 */
            -webkit-backdrop-filter: blur(10px); /* Safari 和 Chrome 需要前缀 */
        }


.jbt {

    height: 8px; /* 设置渐变条的高度 */
    width: 400%; /* 设置渐变条的宽度为*/
    background: 
      linear-gradient(90deg, 
        purple, 
        blue, 
        darkblue, 
        lightblue, 
        white, 
        yellow, 
        green,
        transparent
      );
    background-size: 400% 100%; /* 增加背景大小，以创建动画效果 */
    animation: Gradient 30s ease infinite; /* 添加动画 */
  }

  @keyframes Gradient {
    0% {
      background-position: 0% 50%;
    }
    100% {
      background-position: 400% 50%;
    }


                </style>        
        </head>
        <body>


        <div class="jbt"></div>



                <h1 class="blurry">123</h1>


        </body>

</html>

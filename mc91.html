<!DOCTYPE html>
<html>
        <head>
<title>mc91 skyblock</title>
<style>
  body {
    background-color: black; /* 设置背景颜色为黑色 */
    color: white;            /* 设置文本颜色为白色，以提高可读性 */
  }
.jbt {

    height: 5px; /* 设置渐变条的高度 */
    width: 400%; /* 设置渐变条的宽度为*/
    background: 
      linear-gradient(90deg, 
        purple, 
        blue, 
        darkblue, 
        lightblue, 
        white, 
        yellow, 
        green,
        transparent
      );
    background-size: 400% 100%; /* 增加背景大小，以创建动画效果 */
    animation: Gradient 30s ease infinite; /* 添加动画 */
  }

  @keyframes Gradient {
    0% {
      background-position: 0% 50%;
    }
    100% {
      background-position: 400% 50%;
    }


                </style>        
        </head>
        <body>


        <div class="jbt"></div>



                <h1>123</h1>


        </body>

</html>

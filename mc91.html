<!DOCTYPE html>
<html>
        <head>

<meta name="viewport"content="width=device-width,initial-scale=1.0"> 
<title>mc91 skyblock</title>
<style>
  body {
    background-color: black; /* 设置背景颜色为黑色 */
    color: white;            /* 设置文本颜色为白色，以提高可读性 */
  }
.jbt {

    height: 5px; /* 设置渐变条的高度 */
    width: 100vw; /* 设置渐变条的宽度为视口宽度 */
    position: relative; /* 使元素可以相对于其正常位置定位 */
    left: 50%; /* 向左移动50% */
    transform: translateX(-50%); /* 再次向左移动50%自身宽度，实现居中效果 */
    background: 
      linear-gradient(90deg, 
        purple, 
        blue, 
        darkblue, 
        lightblue, 
        white, 
        yellow, 
        green,
        transparent
      );
        nav {
            display: flex;
            justify-content: center;
            background: #ddd;
            padding: 15px 0;
        }
        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #333;




                </style>        
        </head>
        <body>
   <p class="jbt"></p>

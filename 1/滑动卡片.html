<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动滑动卡片</title>
    <style>
        /* 基础样式 */
        .card {
            width: 300px;
            height: 200px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            position: relative;

        }

        /* 动画定义 */
        @keyframes slideDown {
            from {
                transform: translateY(-50px);
            }
            to {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>标题</h2>
        <p>这是一个加载后自动向下平滑滑动的卡片。</p>
    </div>
</body>
</html>

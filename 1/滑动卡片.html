<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Slide Down Animation</title>
    <style>
        .card {
            width: 300px;
            height: 200px;
            background-color: #f0f0f0;
            position: absolute;
            top: -100%; /* 初始位置在屏幕顶部之外 */
            transition: top 0.5s ease-out; /* 0.5秒的过渡动画效果 */
        }
    </style>
</head>
<body>
    <button id="slideDown">显示卡片</button>
    <div class="card" id="card">
        <h2>欢迎</h2>
        <p>这是一个从上到下滑动的卡片。</p>
    </div>
    <script>
        document.getElementById('slideDown').addEventListener('click', function() {
            const card = document.getElementById('card');
            card.style.top = '0'; // 改变卡片位置到屏幕顶部
        });
    </script>
</body>
</html>
